<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Storaboga Sound — The Séance Threshold</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       DEADLOCK FONT DEFINITIONS (LOCAL OTF FILES)
       ============================================================ */
    @font-face {
      font-family: 'Reaver';
      src: url('assets/fonts/reaver-regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Reaver';
      src: url('assets/fonts/reaver-semibold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Reaver';
      src: url('assets/fonts/reaver-bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Demo';
      src: url('assets/fonts/retaildemo-regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Demo';
      src: url('assets/fonts/retaildemo-medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Demo';
      src: url('assets/fonts/retaildemo-semibold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Demo';
      src: url('assets/fonts/retaildemo-bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Text Demo';
      src: url('assets/fonts/retailtextdemo-regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Text Demo';
      src: url('assets/fonts/retailtextdemo-bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    /* ============================================================
       DECOMPILED DEADLOCK COLOR TOKENS & DESIGN SYSTEM
       ============================================================ */
    :root {
      --off-black: #10130D;
      --off-white: #FFEFD7;
      --soul-color: #70F8C1;
      --shard-color: #99FFD6;
      --brand-green: #5FE69E;
      --gold-color: #FFED79;
      --spirit-color: #8A55B3;
      --weapon-color: #E58A00;
      --enemy-color: #FF410D;
      --team1-neutral: #55503E;
      --team2-color: #4D75C3;
      --steam-blue: #1A9FFF;
      --rank0-color: #333333;
      --default-bg-1: #333333;
      --default-bg-2: #404040;
      --silvered: #C6C6C6;
      --warm-backer: #564a48;
      --card-shape-default: #575757;
      --in-roster-wash: #c3dcd2;
      --priority-amber: #ffc533;
      --priority-mint: #92eac7;
      --high-priority-mint: #33e59f;
      --flux: var(--accent-dynamic, #70F8C1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: var(--off-black);
      font-family: 'Retail Demo', sans-serif;
      color: var(--off-white);
      -webkit-font-smoothing: antialiased;
    }

    /* Fixed Viewport Container (1920x1080) */
    .dashboard-viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: linear-gradient(135deg, #121513 0%, #131615 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Paper texture over entire page (8% opacity) */
    .dashboard-viewport::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("assets/textures/paper_tile_1k_01.png");
      background-repeat: repeat;
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
    }

    /* Warm-toned Vignette Overlay */
    .dashboard-viewport::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(16, 19, 13, 0.5) 85%, rgba(30, 20, 10, 0.3) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Atmospheric Smoke Layer */
    .smoke-bg-layer {
      position: absolute;
      inset: 0;
      background-image: url("assets/textures/smoke_bg.png");
      background-size: cover;
      background-position: center;
      opacity: 0.35;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 0;
    }

    /* Text Speckle Masking for Headers & Display Text */
    .text-speckle {
      font-family: 'IM Fell English SC', serif;
      text-transform: uppercase;
      color: var(--off-white);
      text-shadow: 0px 0px 0px 5px rgba(16,19,13,0.95), 2px 2px 0px 3px #10130D;
      -webkit-mask-image: url("assets/masks/text_speckle_mask.png");
      mask-image: url("assets/masks/text_speckle_mask.png");
      -webkit-mask-size: cover;
      mask-size: cover;
    }

    /* Floating Soul Particles */
    .soul-particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--soul-color);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: soulDrift 9s infinite cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .soul-particle:nth-child(1) { left: 18%; animation-duration: 8s; animation-delay: 0s; }
    .soul-particle:nth-child(2) { left: 38%; animation-duration: 11s; animation-delay: 2.5s; width: 5px; height: 5px; }
    .soul-particle:nth-child(3) { left: 62%; animation-duration: 9.5s; animation-delay: 1.2s; }
    .soul-particle:nth-child(4) { left: 82%; animation-duration: 12s; animation-delay: 4s; width: 3px; height: 3px; }

    @keyframes soulDrift {
      0% {
        transform: translateY(200px) scale(0.6);
        opacity: 0;
      }
      20% {
        opacity: 0.7;
      }
      80% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-500px) scale(1.4);
        opacity: 0;
      }
    }

    /* Center Threshold Stage */
    .threshold-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      text-align: center;
      max-width: 640px;
    }

    /* Summoning Circle Element (320px diameter) */
    .summoning-circle-frame {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 50%, rgba(112, 248, 193, 0.3) 0%, rgba(86, 143, 120, 0.15) 50%, transparent 80%);
      box-shadow: 0 0 35px rgba(112, 248, 193, 0.3), inset 0 0 25px rgba(112, 248, 193, 0.2);
      border: 1px solid rgba(112, 248, 193, 0.4);
    }

    .summoning-circle-inner-ring {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px dashed rgba(112, 248, 193, 0.3);
      pointer-events: none;
    }

    .summoning-circle-outer-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(255, 239, 215, 0.12);
      pointer-events: none;
    }

    .brand-wordmark-large {
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0.35em;
      color: var(--off-white);
      padding: 0 12px;
    }

    /* Welcome Description */
    .welcome-text {
      font-family: 'IM Fell English SC', serif;
      font-size: 14px;
      letter-spacing: 0.06em;
      line-height: 1.5;
      color: var(--off-white);
      opacity: 0.9;
      max-width: 520px;
    }

    /* Physical Brass Switch Button */
    .brass-switch-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 12px 42px;
      font-family: 'IM Fell English SC', serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--off-white);
      background: linear-gradient(180deg, #4d433b 0%, #2f2a24 100%);
      border: 1px solid rgba(255, 239, 215, 0.25);
      box-shadow: inset 0 2px 4px rgba(255, 239, 215, 0.25), inset 0 -3px 8px rgba(0, 0, 0, 0.8), 0 6px 20px rgba(0, 0, 0, 0.7);
      -webkit-mask-image: url("assets/masks/button_mask_threshold.png");
      mask-image: url("assets/masks/button_mask_threshold.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.04s cubic-bezier(0.1, 0.9, 0.2, 1), background 0.04s ease, border-color 0.04s ease;
    }

    .brass-switch-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("assets/textures/button_paper_tile.png");
      background-repeat: repeat;
      opacity: 0.3;
      pointer-events: none;
    }

    .brass-switch-btn:hover {
      background: linear-gradient(180deg, #66441e 0%, #36220d 100%);
      border-color: var(--weapon-color);
      transform: scale(1.04);
    }

    .brass-switch-btn:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.9);
    }

    /* Minimal Stamped Letterpress Footer */
    .threshold-footer {
      position: absolute;
      bottom: 32px;
      z-index: 10;
      font-size: 12px;
      letter-spacing: 0.35em;
      opacity: 0.65;
    }
  </style>
</head>
<body>

  <!-- FIXED VIEWPORT SHELL (1920x1080) -->
  <div class="dashboard-viewport">

    <!-- Smoke & Ambient Backdrops -->
    <div class="smoke-bg-layer"></div>

    <!-- Floating Soul Particles -->
    <div class="soul-particle"></div>
    <div class="soul-particle"></div>
    <div class="soul-particle"></div>
    <div class="soul-particle"></div>

    <!-- CENTER THRESHOLD STAGE -->
    <main class="threshold-stage">
      
      <!-- 320px Summoning Circle -->
      <div class="summoning-circle-frame">
        <div class="summoning-circle-inner-ring"></div>
        <div class="summoning-circle-outer-ring"></div>
        <h1 class="brand-wordmark-large text-speckle">STORABOGA SOUND</h1>
      </div>

      <!-- Standard Language Welcome Copy -->
      <p class="welcome-text">
        A Discord music bot for small private servers.
      </p>

      <!-- Physical Brass Switch Button -->
      <a href="dashboard.html" class="brass-switch-btn">
        <span class="text-speckle">Login with Discord</span>
      </a>

    </main>

    <!-- Letterpress Footer -->
    <footer class="threshold-footer text-speckle">
      STORABOGA SOUND
    </footer>

  </div>

</body>
</html>
