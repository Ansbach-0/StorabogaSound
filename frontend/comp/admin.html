<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Storaboga Sound — Admin</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       DEADLOCK FONT DEFINITIONS (LOCAL OTF FILES)
       ============================================================ */
    @font-face {
      font-family: 'Reaver';
      src: url('assets/fonts/reaver-regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Reaver';
      src: url('assets/fonts/reaver-semibold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Reaver';
      src: url('assets/fonts/reaver-bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Demo';
      src: url('assets/fonts/retaildemo-regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Demo';
      src: url('assets/fonts/retaildemo-medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Demo';
      src: url('assets/fonts/retaildemo-semibold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Demo';
      src: url('assets/fonts/retaildemo-bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Text Demo';
      src: url('assets/fonts/retailtextdemo-regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Retail Text Demo';
      src: url('assets/fonts/retailtextdemo-bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    /* ============================================================
       DECOMPILED DEADLOCK COLOR TOKENS & DESIGN SYSTEM
       ============================================================ */
    :root {
      --off-black: #10130D;
      --off-white: #FFEFD7;
      --soul-color: #70F8C1;
      --shard-color: #99FFD6;
      --brand-green: #5FE69E;
      --gold-color: #FFED79;
      --spirit-color: #8A55B3;
      --weapon-color: #E58A00;
      --enemy-color: #FF410D;
      --team1-neutral: #55503E;
      --team2-color: #4D75C3;
      --steam-blue: #1A9FFF;
      --rank0-color: #333333;
      --default-bg-1: #333333;
      --default-bg-2: #404040;
      --silvered: #C6C6C6;
      --warm-backer: #564a48;
      --card-shape-default: #575757;
      --in-roster-wash: #c3dcd2;
      --priority-amber: #ffc533;
      --priority-mint: #92eac7;
      --high-priority-mint: #33e59f;
      --flux: var(--accent-dynamic, #70F8C1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: var(--off-black);
      font-family: 'Retail Demo', sans-serif;
      color: var(--off-white);
      -webkit-font-smoothing: antialiased;
    }

    /* Fixed Viewport Container (1920x1080) */
    .dashboard-viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      background-color: var(--off-black);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Warm Vignette Overlay */
    .dashboard-viewport::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(16, 19, 13, 0.5) 85%, rgba(30, 20, 10, 0.3) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Atmospheric Smoke Layer */
    .smoke-bg-layer {
      position: absolute;
      inset: 0;
      background-image: url("assets/textures/smoke_bg.png");
      background-size: cover;
      background-position: center;
      opacity: 0.35;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 1;
    }

    /* Top Bar Header */
    .top-bar {
      position: relative;
      z-index: 10;
      height: 72px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: radial-gradient(ellipse at 50% 100%, rgba(40, 44, 34, 0.96) 0%, rgba(16, 19, 13, 0.99) 100%);
      border-bottom: 1px solid rgba(255, 239, 215, 0.14);
      box-shadow: inset rgba(0, 0, 0, 0.5) 0px -2px 16px 0px, 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    .top-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("assets/textures/paper_tile_1k_01.png");
      background-repeat: repeat;
      opacity: 0.12;
      pointer-events: none;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .brand-logo-crest {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(112, 248, 193, 0.25) 0%, transparent 70%);
      border: 1px solid var(--soul-color);
      transform: rotate(45deg);
    }

    .brand-logo-inner {
      width: 16px;
      height: 16px;
      background-color: var(--soul-color);
    }

    .brand-title {
      font-size: 24px;
      line-height: 1;
    }

    .stamped-title {
      font-family: 'Reaver', serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--off-white);
      text-shadow: 0px 0px 0px 5px rgba(16,19,13,0.95), 2px 2px 0px 3px #10130D;
      -webkit-mask-image: url("assets/masks/text_speckle_mask.png");
      mask-image: url("assets/masks/text_speckle_mask.png");
      -webkit-mask-size: cover;
      mask-size: cover;
    }

    .im-fell-title {
      font-family: 'IM Fell English SC', serif;
      text-transform: uppercase;
      color: var(--off-white);
      text-shadow: 0px 0px 0px 5px rgba(16,19,13,0.95), 2px 2px 0px 3px #10130D;
      -webkit-mask-image: url("assets/masks/text_speckle_mask.png");
      mask-image: url("assets/masks/text_speckle_mask.png");
      -webkit-mask-size: cover;
      mask-size: cover;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .nav-tab {
      position: relative;
      font-family: 'Reaver', serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 10px 22px;
      color: var(--silvered);
      background-color: #33322d;
      -webkit-mask-image: url("assets/masks/button_mask_threshold.png");
      mask-image: url("assets/masks/button_mask_threshold.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
      transition: transform 0.04s cubic-bezier(0.1, 0.9, 0.2, 1), background-color 0.04s ease;
    }

    .nav-tab::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("assets/textures/button_paper_tile.png");
      background-repeat: repeat;
      opacity: 0.25;
      pointer-events: none;
    }

    .nav-tab:hover {
      color: var(--off-white);
      background-color: #48463f;
      transform: scale(1.03);
    }

    .nav-tab.active {
      color: var(--off-white);
      background: linear-gradient(180deg, #33e59f 0%, #1f4f3c 100%);
      text-shadow: 0px 0px 0px 5px rgba(16,19,13,0.95), 2px 2px 0px 3px #10130D;
    }

    .tab-active-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--soul-color);
    }

    /* User Profile Badge */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .voice-status-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(16, 19, 13, 0.85);
      border: 1px solid rgba(95, 230, 158, 0.4);
      padding: 6px 14px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand-green);
    }

    .voice-channel-name {
      font-family: 'Retail Text Demo', monospace;
      font-size: 12px;
      color: var(--brand-green);
      font-weight: 700;
    }

    .user-card-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(30, 32, 26, 0.8);
      border: 1px solid rgba(255, 239, 215, 0.15);
      padding: 5px 12px 5px 6px;
    }

    .user-avatar-frame {
      width: 36px;
      height: 36px;
      background: var(--spirit-color);
      border: 1.5px solid var(--soul-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Reaver', serif;
      font-weight: 700;
      color: var(--off-white);
      font-size: 16px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-family: 'Retail Demo', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: var(--off-white);
      line-height: 1.1;
    }

    .admin-badge {
      font-family: 'Retail Text Demo', monospace;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--spirit-color);
      background: rgba(138, 85, 179, 0.2);
      border: 1px solid rgba(138, 85, 179, 0.4);
      padding: 1px 5px;
      margin-top: 2px;
    }

    /* MAIN CONTAINER: ROSTER BOOK LEDGER */
    .main-container {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 48px;
      height: calc(1080px - 72px - 48px);
      overflow: visible;
    }

    .admin-roster-panel {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: radial-gradient(circle at 50% 30%, rgba(42, 39, 36, 0.94) 0%, rgba(20, 19, 17, 0.97) 100%);
      border: 1px solid rgba(255, 239, 215, 0.12);
      box-shadow: inset rgba(0, 0, 0, 0.6) 0px 0px 32px 0px, 0px 8px 24px rgba(0, 0, 0, 0.7);
      padding: 32px;
      overflow: visible;
    }

    .admin-roster-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("assets/textures/paper_tile_1k_01.png");
      background-repeat: repeat;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    .admin-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .admin-header-title-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .admin-title {
      font-size: 32px;
      letter-spacing: 0.08em;
    }

    .admin-subtitle {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 1.8px;
      color: var(--team1-neutral);
      text-transform: uppercase;
    }

    .deco-divider {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(229,138,0,0.3) 15%, rgba(255,237,121,0.75) 50%, rgba(229,138,0,0.3) 85%, transparent 100%);
      box-shadow: 0 1px 2px rgba(0,0,0,0.8);
      margin: 12px 0 24px 0;
    }

    /* Small Brass Stamp Add Member Button */
    .add-member-btn {
      position: relative;
      padding: 8px 20px;
      font-family: 'IM Fell English SC', serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--off-white);
      background: linear-gradient(180deg, #4d433b 0%, #2f2a24 100%);
      border: 1px solid rgba(255, 239, 215, 0.25);
      box-shadow: inset 0 2px 4px rgba(255, 239, 215, 0.2), inset 0 -2px 6px rgba(0, 0, 0, 0.8);
      -webkit-mask-image: url("assets/masks/button_mask_threshold.png");
      mask-image: url("assets/masks/button_mask_threshold.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      cursor: pointer;
      transition: transform 0.04s cubic-bezier(0.1, 0.9, 0.2, 1), background 0.04s ease;
    }

    .add-member-btn:hover {
      background: linear-gradient(180deg, #66441e 0%, #36220d 100%);
      border-color: var(--weapon-color);
      transform: scale(1.04);
    }

    /* STACKED BRASS NAME PLATES (VARIOUS WIDTHS & ROTATIONS) */
    .nameplates-list {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      overflow-y: auto;
      padding: 8px 0;
    }

    .brass-nameplate {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: radial-gradient(circle at 40% 30%, rgba(54, 50, 44, 0.94) 0%, rgba(26, 24, 21, 0.97) 100%);
      border: 1px solid rgba(255, 239, 215, 0.18);
      box-shadow: inset 0 2px 4px rgba(255, 239, 215, 0.15), inset 0 -3px 8px rgba(0,0,0,0.8), 0 6px 20px rgba(0,0,0,0.6);
      -webkit-mask-image: url("assets/masks/button_mask_threshold.png");
      mask-image: url("assets/masks/button_mask_threshold.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      transition: transform 0.04s ease;
    }

    .brass-nameplate::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("assets/textures/paper_tile_1k_01.png");
      background-repeat: repeat;
      opacity: 0.16;
      pointer-events: none;
    }

    /* Varying Plate Widths & Rotations */
    .brass-nameplate:nth-child(1) { width: 92%; transform: rotate(-0.4deg); }
    .brass-nameplate:nth-child(2) { width: 98%; transform: rotate(0.3deg); }
    .brass-nameplate:nth-child(3) { width: 95%; transform: rotate(-0.2deg); }
    .brass-nameplate:nth-child(4) { width: 100%; transform: rotate(0.4deg); }
    .brass-nameplate:nth-child(5) { width: 94%; transform: rotate(-0.3deg); }

    .brass-nameplate:hover {
      transform: scale(1.015) rotate(0deg) !important;
      z-index: 10;
    }

    .member-info-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .member-name {
      font-size: 18px;
    }

    /* STAMPED METAL ROLE TAGS (NOT PILL SHAPED!) */
    .stamped-role-tag {
      font-family: 'Retail Text Demo', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      padding: 4px 10px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Admin: Spirit Purple Tag with Diamond Border Accents */
    .stamped-role-tag.tag-admin {
      color: var(--off-white);
      background: rgba(138, 85, 179, 0.35);
      border: 1px solid var(--spirit-color);
      box-shadow: inset 0 0 6px rgba(138, 85, 179, 0.4);
    }

    /* Moderator: Brand Green Tag */
    .stamped-role-tag.tag-mod {
      color: var(--off-black);
      background: var(--brand-green);
      border: 1px solid rgba(255,255,255,0.3);
    }

    /* Member: Silvered Tag */
    .stamped-role-tag.tag-member {
      color: var(--silvered);
      background: rgba(51, 51, 51, 0.8);
      border: 1px solid rgba(198, 198, 198, 0.3);
    }

    .owner-guild-label {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 1.2px;
      color: var(--spirit-color);
      text-transform: uppercase;
    }

    /* MECHANICAL TOGGLE BUTTONS (Promote / Demote) */
    .mech-toggle-btn {
      position: relative;
      padding: 6px 16px;
      font-family: 'Reaver', serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--off-white);
      background: #2b2a26;
      border: 1px solid rgba(255, 239, 215, 0.18);
      -webkit-mask-image: url("assets/masks/button_mask_threshold.png");
      mask-image: url("assets/masks/button_mask_threshold.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      cursor: pointer;
      transition: transform 0.04s cubic-bezier(0.1, 0.9, 0.2, 1), background 0.04s ease;
    }

    .mech-toggle-btn.btn-promote:hover {
      background: #1f3d2f;
      color: var(--brand-green);
      border-color: var(--brand-green);
      transform: scale(1.05);
    }

    .mech-toggle-btn.btn-demote:hover {
      background: #3d1f1f;
      color: var(--enemy-color);
      border-color: var(--enemy-color);
      transform: scale(1.05);
    }

    /* Footer Bar */
    .bottom-bar {
      position: relative;
      z-index: 10;
      height: 48px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: radial-gradient(ellipse at 50% 0%, rgba(40, 44, 34, 0.96) 0%, rgba(16, 19, 13, 0.99) 100%);
      border-top: 1px solid rgba(255, 239, 215, 0.14);
      font-family: 'Retail Text Demo', monospace;
      font-size: 11px;
      color: var(--silvered);
    }
  </style>
</head>
<body>

  <!-- FIXED VIEWPORT SHELL (1920x1080) -->
  <div class="dashboard-viewport">

    <div class="smoke-bg-layer"></div>

    <!-- HEADER BAR -->
    <header class="top-bar">
      <div class="brand-section">
        <div class="brand-logo-crest">
          <div class="brand-logo-inner"></div>
        </div>
        <h1 class="brand-title stamped-title">STORABOGA SOUND</h1>
      </div>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs">
        <a href="dashboard.html" class="nav-tab">
          <span>Now Playing</span>
        </a>
        <a href="history.html" class="nav-tab">
          <span>History</span>
        </a>
        <a href="status.html" class="nav-tab">
          <span>Status</span>
        </a>
        <a href="settings.html" class="nav-tab">
          <span>Settings</span>
        </a>
        <a href="admin.html" class="nav-tab active">
          <span class="tab-active-dot"></span>
          <span>Admin</span>
        </a>
        <a href="login.html" class="nav-tab">
          <span>Login with Discord</span>
        </a>
      </nav>

      <!-- User Profile -->
      <div class="user-profile">
        <div class="voice-status-chip">
          <span class="pulse-dot"></span>
          <span class="voice-channel-name">#lounge</span>
        </div>
        <div class="user-card-badge">
          <div class="user-avatar-frame">V</div>
          <div class="user-info">
            <span class="user-name">Vini</span>
            <span class="admin-badge">ADMIN</span>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="main-container">
      <section class="admin-roster-panel">

        <!-- Admin Title Header & Top Action -->
        <div class="admin-header">
          <div class="admin-header-title-box">
            <h2 class="admin-title im-fell-title">Admin</h2>
            <span class="admin-subtitle">MEMBER PERMISSION ROSTER</span>
          </div>

          <!-- Stamped Add Member Button -->
          <button class="add-member-btn">
            <span class="text-speckle">+ Add Member</span>
          </button>
        </div>

        <div class="deco-divider"></div>

        <!-- Stacked Brass Name Plates -->
        <div class="nameplates-list">

          <!-- Member 1: waaaarkzi (Admin - top tier) -->
          <div class="brass-nameplate">
            <div class="member-info-left">
              <span class="member-name stamped-title">waaaarkzi</span>
              <span class="stamped-role-tag tag-admin">ADMIN</span>
            </div>
            <span class="owner-guild-label">GUILD OWNER</span>
          </div>

          <!-- Member 2: DJ Söze (Moderator) -->
          <div class="brass-nameplate">
            <div class="member-info-left">
              <span class="member-name stamped-title">DJ Söze</span>
              <span class="stamped-role-tag tag-mod">MODERATOR</span>
            </div>
            <button class="mech-toggle-btn btn-demote">Demote</button>
          </div>

          <!-- Member 3: Nightowl (Member) -->
          <div class="brass-nameplate">
            <div class="member-info-left">
              <span class="member-name stamped-title">Nightowl</span>
              <span class="stamped-role-tag tag-member">MEMBER</span>
            </div>
            <button class="mech-toggle-btn btn-promote">Promote</button>
          </div>

          <!-- Member 4: Cassiopeia (Member) -->
          <div class="brass-nameplate">
            <div class="member-info-left">
              <span class="member-name stamped-title">Cassiopeia</span>
              <span class="stamped-role-tag tag-member">MEMBER</span>
            </div>
            <button class="mech-toggle-btn btn-promote">Promote</button>
          </div>

          <!-- Member 5: The Hermit (Moderator) -->
          <div class="brass-nameplate">
            <div class="member-info-left">
              <span class="member-name stamped-title">The Hermit</span>
              <span class="stamped-role-tag tag-mod">MODERATOR</span>
            </div>
            <button class="mech-toggle-btn btn-demote">Demote</button>
